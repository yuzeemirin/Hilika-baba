<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Very Important Question 🥔🌸</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #ffe4b8,
        #fff0c9,
        #ffd9e8
    );

    color:#5b4638;
}


/* =========================
   FALLING FLOWERS
========================= */

.flower{
    position:fixed;
    top:-70px;
    z-index:1;
    pointer-events:none;
    user-select:none;

    animation:flowerFall linear forwards;
}


/* =========================
   MAIN CARD
========================= */

.card{
    width:min(92vw,430px);

    padding:30px 22px;

    text-align:center;

    background:rgba(255,255,255,.94);

    border-radius:32px;

    box-shadow:
        0 20px 60px rgba(100,70,40,.20);

    position:relative;
    z-index:5;
}


/* Potato */

.potato{
    font-size:75px;

    animation:bounce 1.5s ease-in-out infinite;
}


/* Question */

h1{
    font-size:29px;
    margin:12px 0;

    color:#a86b38;
}

p{
    font-size:18px;
    line-height:1.5;

    min-height:50px;

    margin-bottom:20px;
}


/* =========================
   BUTTONS
========================= */

button{
    border:0;

    border-radius:999px;

    padding:14px 20px;

    margin:7px;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 7px 18px rgba(100,70,40,.15);
}

#yes{
    background:#d49a55;
    color:white;
}

#no{
    background:#f7eee5;
    color:#6d5747;
}


/* Moving NO */

#no.running{
    position:fixed;

    z-index:20;

    transition:
        left .15s ease,
        top .15s ease;
}


/* =========================
   FINAL SCREEN
========================= */

.success{
    position:fixed;

    inset:0;

    z-index:30;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px;

    overflow:hidden;

    background:linear-gradient(
        135deg,
        #ffe0ad,
        #fff0c9,
        #ffd8e8
    );
}

.successBox{
    width:min(94vw,520px);

    position:relative;

    z-index:100;
}


.bigPotatoes{
    font-size:70px;

    animation:bounce .8s infinite;
}


.finalTitle{
    font-size:
        clamp(40px,11vw,68px);

    line-height:1;

    color:#a86532;

    margin:20px 0;

    font-weight:900;

    animation:pop 1s ease both;
}


.finalText{
    font-size:23px;

    line-height:1.5;

    color:#624b3d;

    animation:fadeUp 1.3s ease both;
}


/* =========================
   GIF AREA
========================= */

.gifRain{
    position:fixed;

    inset:0;

    z-index:20;

    pointer-events:none;

    overflow:hidden;
}


.dancingGif{
    position:absolute;

    object-fit:contain;

    animation:
        gifDance 1s ease-in-out infinite alternate;
}


/* =========================
   POTATO RAIN
========================= */

.potatoRain{
    position:fixed;

    inset:0;

    z-index:50;

    pointer-events:none;

    overflow:hidden;
}


.fallingPotato{
    position:absolute;

    top:-80px;

    animation:
        potatoFall linear forwards;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes bounce{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-12px)
            rotate(5deg);
    }
}


@keyframes flowerFall{

    0%{
        transform:
            translateY(-80px)
            translateX(0)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    25%{
        transform:
            translateY(25vh)
            translateX(25px)
            rotate(90deg);
    }

    50%{
        transform:
            translateY(55vh)
            translateX(-25px)
            rotate(180deg);
    }

    75%{
        transform:
            translateY(80vh)
            translateX(20px)
            rotate(270deg);
    }

    100%{
        transform:
            translateY(115vh)
            translateX(-20px)
            rotate(360deg);

        opacity:0;
    }
}


@keyframes potatoFall{

    0%{
        transform:
            translateY(-100px)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translateY(120vh)
            rotate(720deg);

        opacity:0;
    }
}


@keyframes gifDance{

    from{
        transform:
            translateY(-8px)
            rotate(-8deg)
            scale(.9);
    }

    to{
        transform:
            translateY(8px)
            rotate(8deg)
            scale(1.1);
    }
}


@keyframes pop{

    0%{
        transform:scale(.2);
        opacity:0;
    }

    70%{
        transform:scale(1.12);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}


@keyframes fadeUp{

    from{
        transform:translateY(25px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

</style>
</head>


<body>


<!-- =========================
     QUESTION
========================= -->

<div class="card">

    <div class="potato">
        🥔
    </div>

    <h1>
        VERY IMPORTANT QUESTION 👀
    </h1>

    <p id="message">
        Are you secretly a potato? 👀🥔
    </p>

    <div>

        <button id="yes">
            YES… you caught me 😭🥔
        </button>

        <button id="no">
            NOOO 😂
        </button>

    </div>

</div>


<!-- =========================
     SONG
========================= -->

<audio id="music" preload="auto">

    <source
        src="05TA9jNnCdU-1646175fdc6ce34aac278b48f0dbe210193.mp3"
        type="audio/mpeg">

</audio>


<script>


/* =================================
   FALLING FLOWERS 🌸🌺🌷
================================= */

const flowers = [

    "💐",
    "🌺",
    "🪷",
    "🌸",
    "🌷",
    "💮",
    "🏵️",
    "🪻",
    "🌻",
    "🌼",
    "🍂",
    "🍁",
    "🍄",
    "🍀",
    "🌿"

];


function createFlower(){

    const flower =
        document.createElement("div");

    flower.className =
        "flower";

    flower.textContent =
        flowers[
            Math.floor(
                Math.random() *
                flowers.length
            )
        ];

    flower.style.left =
        Math.random() * 100 + "vw";

    flower.style.fontSize =
        (18 + Math.random() * 25) + "px";

    flower.style.animationDuration =
        (5 + Math.random() * 7) + "s";

    document.body.appendChild(
        flower
    );

    setTimeout(
        () => flower.remove(),
        13000
    );

}


/* Keep flowers falling */

setInterval(
    createFlower,
    350
);


/* Initial flowers */

for(
    let i = 0;
    i < 15;
    i++
){

    setTimeout(
        createFlower,
        i * 200
    );

}


/* =================================
   BUTTONS
================================= */

const yes =
    document.getElementById("yes");

const no =
    document.getElementById("no");

const message =
    document.getElementById("message");


/* =================================
   MUSIC 🎵
   
   START = 36 seconds
   END   = 50 seconds
================================= */

const music =
    document.getElementById("music");


function playSong(){

    /* Start at 36 seconds */

    music.currentTime = 36;

    music.play().catch(
        error => {

            console.log(
                "Audio could not start:",
                error
            );

        }
    );

}


/* Stop at 50 seconds */

music.addEventListener(
    "timeupdate",
    function(){

        if(
            music.currentTime >= 50
        ){

            music.pause();

            music.currentTime = 0;

        }

    }
);


/* =================================
   MOVE NO BUTTON
================================= */

function moveNo(){

    no.classList.add(
        "running"
    );

    const maxX =
        Math.max(
            10,
            window.innerWidth -
            no.offsetWidth -
            15
        );

    const maxY =
        Math.max(
            10,
            window.innerHeight -
            no.offsetHeight -
            15
        );

    no.style.left =
        Math.random() *
        maxX + "px";

    no.style.top =
        Math.random() *
        maxY + "px";

}


/* =================================
   NO BUTTON
================================= */

no.addEventListener(
    "click",
    function(){

        message.innerHTML =
            "Hmmmm… suspicious 👀🥔<br><br>" +
            "I don't believe you 😂";

        moveNo();

    }
);


/* Computer */

no.addEventListener(
    "mouseenter",
    function(){

        moveNo();

    }
);


/* Phone */

no.addEventListener(
    "touchstart",
    function(event){

        event.preventDefault();

        moveNo();

    },
    {
        passive:false
    }
);


/* =================================
   YES BUTTON
================================= */

yes.addEventListener(
    "click",
    function(){

        /*
           Start song at 36 seconds
           and play until 50 seconds
        */

        playSong();

        showFinal();

    }
);


/* =================================
   FINAL SCREEN
================================= */

function showFinal(){

    const screen =
        document.createElement("div");

    screen.className =
        "success";


    screen.innerHTML = `

        <div class="successBox">

            <div class="bigPotatoes">
                🥔 🥔 🥔
            </div>

            <div class="finalTitle">
                I KNEW IT!!! 😂🥔
            </div>

            <div class="finalText">

                YOU'RE A POTATO! 🥔❤️

                <br><br>

                Welcome to the
                <b>Potato Club</b> 😂

                <br><br>

                🥔✨ Membership: PERMANENT ✨🥔

            </div>

        </div>

    `;


    document.body.appendChild(
        screen
    );


    /* Start dancing GIFs */

    createGifRain();


    /* Start potato rain */

    createPotatoRain();

}


/* =================================
   YOUR GIF FILES
================================= */

const gifFiles = [

    "bunny.gif",

    "dance.gif",

    "quby.gif",

    "baby.gif"

];


/* =================================
   DUPLICATE GIFS
================================= */

function createGifRain(){

    const container =
        document.createElement("div");

    container.className =
        "gifRain";


    document.body.appendChild(
        container
    );


    /*
       16 GIFs total.
       Each GIF appears 4 times.
    */

    for(
        let i = 0;
        i < 16;
        i++
    ){

        const img =
            document.createElement("img");


        img.className =
            "dancingGif";


        img.src =
            gifFiles[
                i % gifFiles.length
            ];


        img.style.left =
            Math.random() * 90 + "vw";


        img.style.top =
            Math.random() * 85 + "vh";


        img.style.width =
            (60 + Math.random() * 60) + "px";


        img.style.height =
            (60 + Math.random() * 60) + "px";


        img.style.animationDuration =
            (0.7 + Math.random()) + "s";


        container.appendChild(
            img
        );

    }

}


/* =================================
   POTATO RAIN 🥔
================================= */

function createPotatoRain(){

    const rain =
        document.createElement("div");

    rain.className =
        "potatoRain";


    document.body.appendChild(
        rain
    );


    setInterval(
        function(){

            const potato =
                document.createElement("div");


            potato.className =
                "fallingPotato";


            potato.textContent =
                [
                    "🥔",
                    "🥔",
                    "🥔",
                    "🍟",
                    "🥔",
                    "🥔"
                ][
                    Math.floor(
                        Math.random() * 6
                    )
                ];


            potato.style.left =
                Math.random() * 100 + "vw";


            potato.style.fontSize =
                (20 + Math.random() * 30) + "px";


            potato.style.animationDuration =
                (2.5 + Math.random() * 3) + "s";


            rain.appendChild(
                potato
            );


            setTimeout(
                () => potato.remove(),
                7000
            );

        },
        120
    );

}

</script>


</body>
</html>
